apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-service
  namespace: upv-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-service
  template:
    metadata:
      labels:
        app: ai-agent-service
    spec:
      containers:
        - name: ai-agent-service
          image: upv/ai-agent-service:latest
          ports:
            - containerPort: 8004
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: upv-db-secret
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: upv-redis-secret
                  key: url
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: upv-kafka-config
                  key: bootstrap_servers
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upv-llm-secrets
                  key: openai_api_key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: upv-llm-secrets
                  key: anthropic_api_key
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-service
  namespace: upv-ai
spec:
  selector:
    app: ai-agent-service
  ports:
    - port: 80
      targetPort: 8004
  type: ClusterIP
