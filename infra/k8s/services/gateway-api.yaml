apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: upv-api
  labels:
    app: gateway-api
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          image: upv/gateway-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: upv-db-secret
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: upv-redis-secret
                  key: url
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: upv-azure-secret
                  key: tenant_id
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: upv-azure-secret
                  key: client_id
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: upv-api
spec:
  selector:
    app: gateway-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
